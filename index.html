                                <h3 className="text-2xl font-black text-brand-text capitalize leading-tight mb-1">{scannedStudent.name}</h3>
                                <p className="text-sm font-semibold text-brand-lightBlue mb-4 px-2">{scannedStudent.schoolName}</p>
                                
                                <div className="grid grid-cols-2 gap-3.5 mb-6 text-left bg-gray-50 p-4 rounded-2xl border border-gray-100/80">
                                    <div>
                                        <p className="text-[10px] text-gray-400 font-black uppercase mb-0.5">Category</p>
                                        <p className="font-black text-sm text-gray-800">{scannedStudent.category}</p>
                                    </div>
                                    <div>
                                        <p className="text-[10px] text-gray-400 font-black uppercase mb-0.5">Gender</p>
                                        <p className="font-black text-sm text-gray-800">{scannedStudent.gender}</p>
                                    </div>
                                    <div className="col-span-2 border-t border-gray-200/60 pt-2.5 mt-1">
                                        <p className="text-[10px] text-gray-400 font-black uppercase mb-0.5">Location</p>
                                        <p className="font-bold text-sm text-gray-800 capitalize leading-tight">{scannedStudent.houseName}, {scannedStudent.place}</p>
                                        <p className="text-xs text-gray-500 mt-0.5">{scannedStudent.panchayat}</p>
                                    </div>
                                </div>

                                {scannedStudent.status === 'Attended' ? (
                                    <div className="mb-6 p-3.5 bg-yellow-50 border border-yellow-200 rounded-2xl flex items-center justify-center gap-2">
                                        <i className="ph-fill ph-warning-circle text-xl text-yellow-600 animate-bounce"></i>
                                        <p className="text-yellow-800 font-bold text-sm">Attendance already marked</p>
                                    </div>
                                ) : null}

                                <div className="flex gap-3">
                                    <button 
                                        type="button"
                                        onClick={cancelAttendance} 
                                        className="flex-1 bg-gray-100 text-gray-600 hover:bg-gray-200 py-4.5 rounded-2xl font-bold transition-colors text-sm"
                                    >
                                        Scan Next
                                    </button>
                                    <button 
                                        type="button"
                                        onClick={confirmAttendance} 
                                        disabled={scannedStudent.status === 'Attended' || attendingProgress}
                                        className="flex-1 bg-brand-success hover:bg-green-600 disabled:bg-gray-200 disabled:text-gray-400 text-white py-4.5 rounded-2xl font-black transition-colors shadow-lg shadow-green-100 text-sm flex items-center justify-center gap-2"
                                    >
                                        {attendingProgress ? (
                                            <i className="ph-fill ph-spinner-gap animate-spin text-xl"></i>
                                        ) : (
                                            <>
                                                <i className="ph-bold ph-check text-base"></i>
                                                Mark Attended
                                            </>
                                        )}
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const AdminLayout = ({ children, setView, activeTab, setActiveTab, onRefresh }) => {
            const [isRefreshing, setIsRefreshing] = useState(false);

            const handleRefresh = async () => {
                setIsRefreshing(true);
                await onRefresh();
                setTimeout(() => setIsRefreshing(false), 500); // Visual delay for spinner
            };

            useEffect(() => {
                document.body.classList.add('admin-layout');
                return () => document.body.classList.remove('admin-layout');
            }, []);

            return (
                <div className="min-h-screen flex flex-col md:flex-row bg-[#F8FAFC]">
                    <aside className="w-full md:w-64 bg-white border-r border-gray-200 flex flex-col shrink-0">
                        <div className="h-20 flex items-center justify-between px-6 border-b border-gray-100 bg-[#0838A8] text-white">
                            <h2 className="font-black font-malayalam text-xl">താനൂർ <span className="text-brand-yellow">താരേ</span></h2>
                            <button onClick={handleRefresh} className="p-2 bg-white/10 hover:bg-white/20 rounded-full transition-all flex items-center justify-center" title="Refresh Live Data">
                                <i className={`ph-bold ph-arrows-clockwise text-xl ${isRefreshing ? 'animate-spin text-brand-yellow' : ''}`}></i>
                            </button>
                        </div>
                        <div className="px-4 py-4 flex-1 flex flex-col gap-1.5">
                            {[
                                { id: 'dashboard', icon: 'ph-squares-four', label: 'Dashboard' },
                                { id: 'registrations', icon: 'ph-users', label: 'Registrations' },
                                { id: 'attendance', icon: 'ph-qr-code', label: 'Attendance' },
                            ].map(item => (
                                <button 
                                    key={item.id}
                                    onClick={() => setActiveTab(item.id)}
                                    className={`flex items-center gap-3 px-4 py-3 rounded-xl font-bold transition-all text-sm ${activeTab === item.id ? 'bg-[#0838A8] text-white shadow-md' : 'text-gray-500 hover:bg-gray-100'}`}
                                >
                                    <i className={`ph-bold ${item.icon} text-lg`}></i>
                                    {item.label}
                                </button>
                            ))}
                        </div>
                        <div className="p-4 border-t border-gray-100">
                            <button onClick={() => setView('home')} className="flex items-center gap-3 px-4 py-3 rounded-xl font-bold text-red-500 hover:bg-red-50 w-full transition-colors text-sm">
                                <i className="ph-bold ph-sign-out text-lg"></i> Exit Admin
                            </button>
                        </div>
                    </aside>
                    <main className="flex-1 flex flex-col h-screen overflow-y-auto bg-[#F8FAFC]">
                        {children}
                    </main>
                </div>
            );
        };

        const App = () => {
            const [view, setView] = useState('home');
            const [regData, setRegData] = useState(null);
            const [adminData, setAdminData] = useState([]);
            const [adminTab, setAdminTab] = useState('dashboard');
            const [showPassword, setShowPassword] = useState(false);
            const [password, setPassword] = useState('');
            const [loginError, setLoginError] = useState('');

            useEffect(() => {
                window.scrollTo(0, 0);
            }, [view]);

            const fetchAdminData = async () => {
                const data = await MOCK_DB.getRegistrations();
                setAdminData(data);
            };

            useEffect(() => {
                if (view === 'admin') fetchAdminData();
            }, [view, adminTab]);

            const handleAdminLogin = async (e) => {
                e.preventDefault();
                setLoginError("Verifying with server...");
                
                try {
                    const res = await fetch(GOOGLE_SHEET_WEB_APP_URL, {
                        method: "POST",
                        body: JSON.stringify({ action: "verifyPassword", password: password })
                    });
                    const data = await res.json();
                    
                    if (data.success) {
                        MOCK_DB.adminPassword = password; // Save verified password for future admin queries
                        setView('admin');
                        setShowPassword(false);
                        setPassword('');
                        setLoginError('');
                    } else {
                        setLoginError("Incorrect Admin Password!");
                    }
                } catch(err) {
                    setLoginError("Connection failed. Try again.");
                }
            };

            if (view === 'admin') {
                return (
                    <AdminLayout setView={setView} activeTab={adminTab} setActiveTab={setAdminTab} onRefresh={fetchAdminData}>
                        {adminTab === 'dashboard' && <AdminDashboard data={adminData} />}
                        {adminTab === 'registrations' && <AdminRegistrations data={adminData} refreshData={fetchAdminData} />}
                        {adminTab === 'attendance' && <AdminAttendance data={adminData} refreshData={fetchAdminData} />}
                    </AdminLayout>
                );
            }

            return (
                <div className="min-h-screen flex flex-col">
                    <main className="flex-grow">
                        {view === 'home' && (
                            <HomeView 
                                setView={setView} 
                                setShowPassword={setShowPassword}
                                showPassword={showPassword}
                                handleAdminLogin={handleAdminLogin}
                                password={password}
                                setPassword={setPassword}
                                errorMsg={loginError}
                            />
                        )}
                        {view === 'search_pass' && <SearchPassView setView={setView} setRegData={setRegData} />}
                        {view === 'register' && <RegisterView setView={setView} setRegData={setRegData} />}
                        {view === 'success' && <SuccessView data={regData} setView={setView} />}
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
